name: Build APK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission
      run: chmod +x gradlew

    - name: Build Debug APK
      id: build_debug
      run: ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee build_debug.log
      continue-on-error: true

    - name: Upload debug log
      if: always()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: python3 scripts/upload_log.py build_debug.log build_debug.log

    - name: Build Release APK
      id: build_release
      if: steps.build_debug.outcome == 'success'
      run: ./gradlew :app:assembleRelease --stacktrace 2>&1 | tee build_release.log
      continue-on-error: true

    - name: Upload release log
      if: always() && steps.build_debug.outcome == 'success'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: python3 scripts/upload_log.py build_release.log build_release.log

    - name: Commit APK(s) via Git Data API
      if: always()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: python3 scripts/commit_apk.py

    - name: Fail job if any build failed
      if: steps.build_debug.outcome == 'failure' || steps.build_release.outcome == 'failure'
      run: exit 1
