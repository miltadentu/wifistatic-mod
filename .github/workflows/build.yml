name: Build APK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission
      run: chmod +x gradlew

    - name: Build Debug APK
      id: build_debug
      run: ./gradlew :app:assembleDebug --stacktrace > build_debug.log 2>&1
      continue-on-error: true

    - name: Save log on failure
      if: steps.build_debug.outcome == 'failure'
      run: |
        git config user.email "ci@github.com"
        git config user.name "CI Bot"
        git checkout --orphan ci-logs || git checkout ci-logs
        git rm -rf . 2>/dev/null || true
        cp /home/runner/work/*/*/build_debug.log ./build_debug.log || cp build_debug.log ./build_debug.log
        git add build_debug.log
        git commit -m "CI build log $(date)"
        git push -f origin ci-logs

    - name: Fail if build failed
      if: steps.build_debug.outcome == 'failure'
      run: exit 1

    - name: Build Release APK
      run: ./gradlew :app:assembleRelease

    - name: List build outputs
      run: find app/build/outputs -name "*.apk" -type f

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: WiFiStaticMod-debug
        path: app/build/outputs/apk/debug/*.apk

    - name: Upload Release APK  
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: WiFiStaticMod-release
        path: app/build/outputs/apk/release/*.apk
