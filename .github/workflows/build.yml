name: Build APK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission
      run: chmod +x gradlew

    - name: Build Debug APK
      id: build_debug
      run: ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee build_debug.log
      continue-on-error: true

    - name: Upload log via Contents API
      if: always()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        tail -c 60000 build_debug.log > build_debug_trimmed.log
        CONTENT=$(base64 -w0 build_debug_trimmed.log)
        REPO="miltadentu/wifistatic-mod"
        BRANCH="ci-logs"
        # Create branch ref if it doesn't exist (point to current main sha)
        MAIN_SHA=$(curl -s -H "Authorization: token $GH_TOKEN" "https://api.github.com/repos/$REPO/git/ref/heads/main" | python3 -c "import sys,json; print(json.load(sys.stdin)['object']['sha'])")
        curl -s -X POST -H "Authorization: token $GH_TOKEN" -H "Content-Type: application/json" \
          "https://api.github.com/repos/$REPO/git/refs" \
          -d "{\"ref\":\"refs/heads/$BRANCH\",\"sha\":\"$MAIN_SHA\"}" > /dev/null
        # Check if file exists already on that branch to get its sha (for update)
        EXISTING_SHA=$(curl -s -H "Authorization: token $GH_TOKEN" "https://api.github.com/repos/$REPO/contents/build_debug.log?ref=$BRANCH" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('sha',''))" 2>/dev/null || echo "")
        if [ -n "$EXISTING_SHA" ]; then
          curl -s -X PUT -H "Authorization: token $GH_TOKEN" -H "Content-Type: application/json" \
            "https://api.github.com/repos/$REPO/contents/build_debug.log" \
            -d "{\"message\":\"CI log update run ${{ github.run_id }}\",\"content\":\"$CONTENT\",\"branch\":\"$BRANCH\",\"sha\":\"$EXISTING_SHA\"}" > /tmp/api_result.json
        else
          curl -s -X PUT -H "Authorization: token $GH_TOKEN" -H "Content-Type: application/json" \
            "https://api.github.com/repos/$REPO/contents/build_debug.log" \
            -d "{\"message\":\"CI log run ${{ github.run_id }}\",\"content\":\"$CONTENT\",\"branch\":\"$BRANCH\"}" > /tmp/api_result.json
        fi
        cat /tmp/api_result.json

    - name: Fail if build failed
      if: steps.build_debug.outcome == 'failure'
      run: exit 1

    - name: Build Release APK
      id: build_release
      run: ./gradlew :app:assembleRelease --stacktrace 2>&1 | tee build_release.log
      continue-on-error: true

    - name: Commit APK(s) to ci-apk branch via Git Data API
      if: always()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        REPO="miltadentu/wifistatic-mod"
        BRANCH="ci-apk"
        python3 << 'PYEOF'
import subprocess, json, base64, os

REPO = "miltadentu/wifistatic-mod"
BRANCH = "ci-apk"
TOKEN = os.environ["GH_TOKEN"]
API = "https://api.github.com"

def gh(method, url, data=None):
    cmd = ["curl", "-s", "-X", method, "-H", f"Authorization: token {TOKEN}",
           "-H", "Content-Type: application/json"]
    if data is not None:
        cmd += ["-d", json.dumps(data)]
    cmd += [url]
    out = subprocess.run(cmd, capture_output=True, text=True).stdout
    return json.loads(out) if out else {}

# Get main branch sha to base new branch on
main_ref = gh("GET", f"{API}/repos/{REPO}/git/ref/heads/main")
main_sha = main_ref["object"]["sha"]

# Ensure ci-apk branch exists
gh("POST", f"{API}/repos/{REPO}/git/refs", {"ref": f"refs/heads/{BRANCH}", "sha": main_sha})

files_to_commit = []
for label, path in [("debug", "app/build/outputs/apk/debug/app-debug.apk"),
                     ("release", "app/build/outputs/apk/release/app-release-unsigned.apk")]:
    if os.path.exists(path):
        files_to_commit.append((label, path))

if not files_to_commit:
    print("No APK files found to commit")
else:
    tree_items = []
    for label, path in files_to_commit:
        with open(path, "rb") as f:
            content_b64 = base64.b64encode(f.read()).decode()
        blob = gh("POST", f"{API}/repos/{REPO}/git/blobs", {"content": content_b64, "encoding": "base64"})
        sha = blob["sha"]
        tree_items.append({"path": f"WiFiStaticMod-{label}.apk", "mode": "100644", "type": "blob", "sha": sha})
        print(f"Uploaded blob for {label}: {sha}")

    base_ref = gh("GET", f"{API}/repos/{REPO}/git/ref/heads/{BRANCH}")
    base_sha = base_ref["object"]["sha"]
    base_commit = gh("GET", f"{API}/repos/{REPO}/git/commits/{base_sha}")
    base_tree_sha = base_commit["tree"]["sha"]

    new_tree = gh("POST", f"{API}/repos/{REPO}/git/trees", {"base_tree": base_tree_sha, "tree": tree_items})
    new_commit = gh("POST", f"{API}/repos/{REPO}/git/commits", {
        "message": f"CI APK build run {os.environ.get('GITHUB_RUN_ID','')}",
        "tree": new_tree["sha"],
        "parents": [base_sha]
    })
    update = gh("PATCH", f"{API}/repos/{REPO}/git/refs/heads/{BRANCH}", {"sha": new_commit["sha"], "force": True})
    print("Branch updated:", update.get("ref"))
PYEOF

    - name: List build outputs
      run: find app/build/outputs -name "*.apk" -type f

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: WiFiStaticMod-debug
        path: app/build/outputs/apk/debug/*.apk

    - name: Upload Release APK  
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: WiFiStaticMod-release
        path: app/build/outputs/apk/release/*.apk
